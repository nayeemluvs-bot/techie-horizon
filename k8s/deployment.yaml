apiVersion: apps/v1
kind: Deployment
metadata:
  name: techie-horizon
  namespace: techie-horizon
  labels:
    app: techie-horizon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techie-horizon
  template:
    metadata:
      labels:
        app: techie-horizon
    spec:
      containers:
        - name: techie-horizon
          image: nayeemluvs/techie-horizon:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
